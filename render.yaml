# One-click deploy on Render (free). New + → Blueprint → connect this repo → fill the 3 secrets.
# Always-on HTTPS URL the Vruksha team can test without installing anything.
# The free Postgres below is auto-created and wired to DATABASE_URL, so project recall
# persists across deploys (with a JSON-file fallback when no DB is present).
databases:
  - name: vruksha-db
    plan: free
    databaseName: vruksha
    user: vruksha

services:
  - type: web
    name: vruksha-voice-agent
    runtime: python
    plan: free
    # Lean runtime deps only: STT=groq and TTS=elevenlabs need no local models,
    # so we skip faster-whisper / edge-tts here to keep the build small and fast.
    buildCommand: pip install fastapi "uvicorn[standard]" python-multipart pydantic python-dotenv httpx groq "psycopg[binary]" pyotp
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vruksha-db
          property: connectionString
      - key: STT_PROVIDER
        value: groq
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TTS_PROVIDER
        value: elevenlabs
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      - key: ELEVENLABS_MODEL
        value: eleven_multilingual_v2
      - key: DEFAULT_LANG
        value: en
      - key: PYTHON_VERSION
        value: "3.11"
      # secrets — set these in the Render dashboard, never in the repo.
      # No PROOF_TOKEN here: posting is per-user (each user enters their own on the portal).
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
